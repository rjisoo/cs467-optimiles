<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiMiles API docs</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.0/swagger-ui.css">
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <div id="swagger-ui">
      <p>Loading Swagger UI (requires internet access).
        <a href="{{ url_for('openapi_spec') }}">View the OpenAPI schema</a>.</p>
    </div>
    <noscript>Enable JavaScript to use the interactive API documentation.</noscript>
    <script src="https://unpkg.com/swagger-ui-dist@5.34.0/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: {{ url_for('openapi_spec') | tojson }},
          dom_id: '#swagger-ui',
          deepLinking: true,
          validatorUrl: null,
        });
      };
    </script>
  </body>
</html>
