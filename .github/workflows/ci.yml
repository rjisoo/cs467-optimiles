name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency: deploy-production

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Tests use fake Gemini and seats.aero clients, so no secrets are needed.
      - run: python -m pytest -q

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SEATSAERO_TOKEN: ${{ secrets.SEATSAERO_TOKEN }}
      SEATSAERO_BASE_URL: ${{ vars.SEATSAERO_BASE_URL || 'https://seats.aero/partnerapi' }}
      DOMAIN: ${{ vars.DOMAIN }}
      CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      